<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menderes Belediye Meclisi Üye Dağılımı</title>
<style>
  :root{
    --chp:#E4032E;
    --akp:#F5A623;
    --mhp:#2563EB;
    --bagimsiz:#6B7280;
    --ink:#1F2430;
    --muted:#6B7280;
    --bg:#FFFFFF;
    --card:#F8F9FB;
    --border:#E7E9EE;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
  }
  .wrap{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:16px 20px 14px;
    background:var(--bg);
  }
  .title{
    font-size:17px;
    font-weight:700;
    text-align:center;
    letter-spacing:.2px;
    margin:0 0 2px;
  }
  .subtitle{
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin:0 0 10px;
  }
  .content{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:0;
    padding:0 4px;
  }
  .chart{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:30px;
    width:100%;
    max-width:520px;
    height:140px;
    padding:0 10px;
  }
  .col{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    flex:0 0 auto;
    width:76px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .col .bar{
    transition:opacity .15s ease, transform .15s ease;
  }
  .col:hover .bar{
    opacity:.85;
  }
  .col.active .bar{
    opacity:1;
    box-shadow:0 0 0 2px var(--ink);
  }
  .col.active .name{
    color:inherit;
  }
  .info-box{
    max-width:520px;
    margin:10px auto 0;
    padding:8px 16px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    font-size:13px;
    text-align:center;
    color:var(--ink);
    min-height:18px;
  }
  .info-box .party-name{
    font-weight:800;
  }
  .info-box.empty{
    color:var(--muted);
  }
  .col .count{
    font-size:17px;
    font-weight:800;
    margin-bottom:4px;
    line-height:1;
  }
  .col .bar{
    width:56px;
    border-radius:6px 6px 0 0;
    margin-top:4px;
  }
  .col .name{
    margin-top:8px;
    font-size:13px;
    font-weight:700;
    text-align:center;
    line-height:1.2;
  }
  .foot{
    text-align:center;
    font-size:10.5px;
    color:var(--muted);
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--border);
  }
  @media (max-width:420px){
    .chart{gap:16px;height:120px;}
    .col{width:62px;}
    .col .bar{width:44px;}
    .col .count{font-size:15px;}
    .col .name{font-size:11.5px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <p class="title">Menderes Belediye Meclisi Üye Dağılımı</p>
    <p class="subtitle">Toplam 31 üye</p>

    <div class="content">
      <div class="chart" id="chart">
        <div class="col" data-party="CHP" data-count="18" data-pct="%58,1" data-color="var(--chp)">
          <span class="count">18</span>
          <div class="bar" style="height:100px;background:var(--chp)"></div>
          <span class="name">CHP</span>
        </div>
        <div class="col" data-party="AKP" data-count="10" data-pct="%32,3" data-color="var(--akp)">
          <span class="count">10</span>
          <div class="bar" style="height:56px;background:var(--akp)"></div>
          <span class="name">AKP</span>
        </div>
        <div class="col" data-party="Bağımsız" data-count="2" data-pct="%6,5" data-color="var(--bagimsiz)">
          <span class="count">2</span>
          <div class="bar" style="height:11px;background:var(--bagimsiz)"></div>
          <span class="name">Bağımsız</span>
        </div>
        <div class="col" data-party="MHP" data-count="1" data-pct="%3,2" data-color="var(--mhp)">
          <span class="count">1</span>
          <div class="bar" style="height:6px;background:var(--mhp)"></div>
          <span class="name">MHP</span>
        </div>
      </div>
    </div>

    <div class="info-box empty" id="infoBox">Bilgi görmek için bir sütuna tıklayın</div>

    <p class="foot">Menderes Belediye Meclisi Başkanvekili seçimi haberine ilişkin üye dağılımı</p>
  </div>
  <script>
    (function(){
      var cols = document.querySelectorAll('#chart .col');
      var infoBox = document.getElementById('infoBox');
      cols.forEach(function(col){
        col.addEventListener('click', function(){
          cols.forEach(function(c){ c.classList.remove('active'); });
          col.classList.add('active');
          var party = col.getAttribute('data-party');
          var count = col.getAttribute('data-count');
          var color = col.getAttribute('data-color');
          infoBox.classList.remove('empty');
          infoBox.innerHTML =
            '<span class="party-name" style="color:' + color + '">' + party + '</span>' +
            ' — ' + count + ' meclis üyesi';
        });
      });
    })();
  </script>
</body>
</html>
